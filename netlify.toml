[build]
  command = "pnpm run build:netlify"
  publish = "artifacts/light-for-change/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
